name: 'Manki Review'
description: 'Multi-agent AI code review for GitHub. Planner triages the change, finders review in parallel, judge filters the noise.'
author: 'xdustinface'

inputs:
  claude_code_oauth_token:
    description: 'Claude Code OAuth token from `claude setup-token` (Claude subscription authentication)'
    required: false
  anthropic_api_key:
    description: 'Anthropic API key (alternative to OAuth token)'
    required: false
  openai_oauth_token:
    description: 'Base64-encoded contents of `~/.codex/auth.json` (Codex CLI OAuth credentials, including `tokens.access_token` and `tokens.refresh_token`). Bootstrap with `cat ~/.codex/auth.json | base64 | gh secret set OPENAI_OAUTH_TOKEN`. Codex rotates the tokens on refresh, so this copy goes stale and must be re-uploaded when Codex fails to authenticate. `openai_api_key` avoids this. OpenAI says to use this login only on a trusted private runner, not for a public or open-source repository, and recommends an API key for most CI jobs (see `docs/getting-started.md`).'
    required: false
  openai_oauth_file:
    description: 'Self-hosted runners only: the absolute path of a Codex login file (`auth.json`) on the runner, used instead of `openai_oauth_token`. Manki copies it into its own Codex home for the run and writes the tokens Codex renews back to it, so the login stays valid. The file and its folder must belong to the runner''s user and be closed to every other user, and they must be outside the workspace and the runner''s temp folder. Create it with `codex login` under a Codex home of its own (see `docs/getting-started.md`). Cannot be combined with `openai_oauth_token` or `openai_base_url`.'
    required: false
  openai_api_key:
    description: 'OpenAI API key (alternative to OAuth token), or the key of the endpoint in `openai_base_url`'
    required: false
  openai_base_url:
    description: 'Base URL of an OpenAI-compatible endpoint, such as `https://llm.example.com/v1`: a company gateway, Azure OpenAI or a self-hosted endpoint. With it, every OpenAI model runs through the Codex CLI against that endpoint, authenticated with `openai_api_key`, and the reviewers get their repository tools. The endpoint has to speak the Responses API, which is what the Codex CLI sends. It needs `openai_api_key` and cannot be combined with `openai_oauth_token` or `openai_oauth_file`.'
    required: false
  gemini_oauth_token:
    description: 'Base64-encoded contents of `~/.gemini/oauth_creds.json` (Gemini CLI OAuth credentials, including `access_token` and `refresh_token`). Bootstrap with `cat ~/.gemini/oauth_creds.json | base64 | gh secret set GEMINI_OAUTH_TOKEN`. Re-run when the refresh_token expires. Login with Google ended on 2026-06-18 for Gemini Code Assist for individuals, Google AI Pro and Google AI Ultra, so this works only for organization accounts with a Gemini Code Assist Standard or Enterprise license. Everyone else should use `gemini_api_key`.'
    required: false
  gemini_api_key:
    description: 'Google Generative AI API key (alternative to Gemini OAuth token)'
    required: false
  github_token:
    description: 'GitHub token for reading the dispatched event and CI results, and for posting a note when the Manki token service fails. Defaults to the workflow token. Reviews and comments always use the App token.'
    required: false
    default: '${{ github.token }}'
  memory_repo_token:
    description: 'GitHub token with write access to your own review memory repository in `memory.repo` (learnings, suppressions, fix-rate metrics). The central memory needs no token, and without `memory.repo` this input is unused'
    required: false
  github_app_id:
    description: 'GitHub App ID for custom bot identity (reviews show as the app name)'
    required: false
  github_app_private_key:
    description: 'GitHub App private key (PEM format) for generating installation tokens'
    required: false
  manki_token_url:
    description: 'Token service URL for GitHub App identity (default: https://manki-api.dustinface.me/token)'
    required: false
    default: 'https://manki-api.dustinface.me/token'

outputs:
  review_id:
    description: 'The GitHub review ID that was posted'
  verdict:
    description: 'Review verdict: APPROVE only when Manki approved the PR, REQUEST_CHANGES when the round found a blocker, otherwise COMMENT. A held approval is COMMENT.'
  approval_held:
    description: 'Why a round that would approve posted COMMENT instead: conflict, draft, config, unread, warnings, or refused (GitHub refused the approval). Empty when the approval is not held.'
  findings_count:
    description: 'Total number of findings'
  findings_json:
    description: 'JSON array of all findings (for downstream processing)'
  severity_counts:
    description: 'JSON object with severity counts: {blocker, warning, note}'
  judge_model:
    description: 'Model used for the judge agent'

runs:
  using: 'node24'
  main: 'dist/index.js'
  post: 'dist/index.js'
  post-if: cancelled() || failure()

branding:
  icon: 'eye'
  color: 'green'
