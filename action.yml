name: 'Manki Review'
description: 'Multi-agent AI code review for GitHub. Planner triages the change, finders review in parallel, judge filters the noise.'
author: 'xdustinface'

inputs:
  claude_code_oauth_token:
    description: 'Claude Code OAuth token from `claude setup-token` (Claude subscription authentication)'
    required: false
  anthropic_api_key:
    description: 'Anthropic API key (alternative to OAuth token)'
    required: false
  openai_oauth_token:
    description: 'Base64-encoded contents of `~/.codex/auth.json` (Codex CLI OAuth credentials, including `tokens.access_token` and `tokens.refresh_token`). Bootstrap with `cat ~/.codex/auth.json | base64 | gh secret set OPENAI_OAUTH_TOKEN`. Codex rotates the tokens on refresh, so this copy goes stale and must be re-uploaded when Codex fails to authenticate. `openai_api_key` avoids this.'
    required: false
  openai_api_key:
    description: 'OpenAI API key (alternative to OAuth token)'
    required: false
  gemini_oauth_token:
    description: 'Base64-encoded contents of `~/.gemini/oauth_creds.json` (Gemini CLI OAuth credentials, including `access_token` and `refresh_token`). Bootstrap with `cat ~/.gemini/oauth_creds.json | base64 | gh secret set GEMINI_OAUTH_TOKEN`. Re-run when the refresh_token expires. Login with Google ended on 2026-06-18 for Gemini Code Assist for individuals, Google AI Pro and Google AI Ultra, so this works only for organization accounts with a Gemini Code Assist Standard or Enterprise license. Everyone else should use `gemini_api_key`.'
    required: false
  gemini_api_key:
    description: 'Google Generative AI API key (alternative to Gemini OAuth token)'
    required: false
  github_token:
    description: 'GitHub token for posting reviews and comments. Defaults to the workflow token. Used when the Manki GitHub App is not installed, and as the fallback when its token cannot be fetched.'
    required: false
    default: '${{ github.token }}'
  config_path:
    description: 'Path to .manki.yml config file'
    required: false
    default: '.manki.yml'
  memory_repo_token:
    description: 'GitHub token with write access to your own review memory repository in `memory.repo` (learnings, suppressions, fix-rate metrics). The central memory needs no token, and without `memory.repo` this input is unused'
    required: false
  github_app_id:
    description: 'GitHub App ID for custom bot identity (reviews show as the app name)'
    required: false
  github_app_private_key:
    description: 'GitHub App private key (PEM format) for generating installation tokens'
    required: false
  manki_token_url:
    description: 'Token service URL for GitHub App identity (default: https://manki-api.dustinface.me/token)'
    required: false
    default: 'https://manki-api.dustinface.me/token'

outputs:
  review_id:
    description: 'The GitHub review ID that was posted'
  verdict:
    description: 'Review verdict: APPROVE, COMMENT, or REQUEST_CHANGES'
  findings_count:
    description: 'Total number of findings'
  findings_json:
    description: 'JSON array of all findings (for downstream processing)'
  severity_counts:
    description: 'JSON object with severity counts: {blocker, warning, suggestion, nitpick}'
  judge_model:
    description: 'Model used for the judge agent'

runs:
  using: 'node24'
  main: 'dist/index.js'
  post: 'dist/index.js'
  post-if: cancelled() || failure()

branding:
  icon: 'eye'
  color: 'green'
