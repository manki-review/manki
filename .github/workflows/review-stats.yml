name: Review statistics

# Posts the review statistics of manki and token-service once a week on one tracking issue, so trends show without
# anyone running the script. It only reads pull requests and the fix rates in the central memory repository, and comments
# on that issue.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: review-stats

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Build the report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MEMORY_REPO: manki-review/review-memory
        run: |
          for repo in manki-review/manki manki-review/token-service; do
            gh api -H 'Accept: application/vnd.github.raw' "repos/$MEMORY_REPO/contents/$repo/metrics/fix-rate.jsonl" > fix-rate.jsonl
            npm run -s review-stats -- --repo "$repo" --fix-rate fix-rate.jsonl
            echo
          done > report.md
      - name: Comment on the tracking issue, opening it the first time
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Weekly review statistics
        run: |
          # Only the issue this workflow opened, so nobody can redirect the report by opening one with the same title.
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --author app/github-actions --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE))[0].number // empty")
          if [ -z "$number" ]; then
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body 'The review statistics workflow comments here every week with `npm run review-stats` for manki and token-service.')
            number=${url##*/}
          fi
          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file report.md
