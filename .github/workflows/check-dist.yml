# `dist/index.js` is the entrypoint that runs when a workflow references
# `manki-review/manki@<ref>` via `uses:`. It is generated from `src/` by
# `npm run build`. This workflow rebuilds `dist/` on every push and PR and
# fails if the committed copy drifts from the freshly built one.
name: Check dist

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  check-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild dist/
        run: npm run build

      - name: Compare committed dist/ against fresh build
        id: diff
        run: |
          if [ "$(git diff --ignore-space-at-eol --text dist/ | wc -l)" -gt "0" ]; then
            echo "Committed dist/ does not match a fresh build."
            echo "Run 'npm run build' locally and commit the updated dist/."
            git diff --text dist/
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: dist
          path: dist/
