name: Provider smoke

on:
  workflow_dispatch:
  schedule:
    # Mondays at 09:00 UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.provider }} (${{ matrix.model }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: anthropic
            model: claude-haiku-4-5
          - provider: openai
            model: o4-mini
          - provider: gemini
            model: gemini-2.5-flash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run smoke
        shell: bash
        env:
          MODEL: ${{ matrix.model }}
          PROVIDER: ${{ matrix.provider }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_OAUTH_TOKEN: ${{ secrets.OPENAI_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_OAUTH_TOKEN: ${{ secrets.GEMINI_OAUTH_TOKEN }}
        run: |
          set +e
          npm run smoke -- --model "${MODEL}"
          rc=$?
          if [ $rc -eq 2 ]; then
            echo "::notice title=Smoke skipped::No credentials configured for ${PROVIDER}"
            exit 0
          fi
          exit $rc
