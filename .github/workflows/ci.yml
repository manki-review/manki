name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # first-party GitHub action
        with:
          fetch-depth: 2
      - name: Keep CHANGELOG.md edits to release PRs
        if: github.event_name == 'pull_request'
        # On a pull_request event HEAD is the merge commit, so HEAD^1 is the base it merges into.
        run: |
          git diff --quiet HEAD^1 HEAD -- CHANGELOG.md && exit 0
          base=$(git show HEAD^1:package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          head=$(node -p "require('./package.json').version")
          [ "$base" != "$head" ] && exit 0
          # A release that is merged but has no tag yet may still get its notes rewritten, by a
          # PR that changes its section of CHANGELOG.md and nothing else. Only the exit status 2
          # of `ls-remote` says for sure that the tag does not exist.
          tag_status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$head" >/dev/null || tag_status=$?
          # Prints CHANGELOG.md without the section of the version on this branch.
          outside() { awk -v heading="## [$head]" 'index($0, heading) == 1 { skip = 1; next } skip && /^## / { skip = 0 } !skip'; }
          before=$(git show HEAD^1:CHANGELOG.md | outside)
          after=$(outside < CHANGELOG.md)
          if [ "$tag_status" -eq 2 ] && [ "$(git diff --name-only HEAD^1 HEAD)" = "CHANGELOG.md" ] && [ -n "$before" ] && [ "$before" = "$after" ]; then
            exit 0
          fi
          echo "::error file=CHANGELOG.md::Only release PRs edit CHANGELOG.md. Put what users need to know in the PR title and body, and the release PR collects it."
          exit 1
      - uses: actions/setup-node@v7  # first-party GitHub action
        with:
          node-version: '24'
          cache: 'npm'
      - name: Check package.json and CHANGELOG.md versions agree
        run: node scripts/check-changelog-version.js
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad  # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
      - run: npm run build
