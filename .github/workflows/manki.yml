name: Manki

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, closed]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  review:
    # Mirrors the entry checks in `run()` in `src/index.ts`, and lets only owners, members and collaborators start a run from a comment. The bot login is `BOT_LOGIN` in `src/github.ts`.
    if: >-
      github.actor != 'manki-review[bot]'
      && github.event.sender.type != 'Bot'
      && github.event.review.user.type != 'Bot'
      && (github.event.action != 'closed' || github.event.pull_request.merged)
      && (github.event_name != 'issue_comment' || contains(github.event.comment.body, '@manki') || contains(github.event.comment.body, '/manki') || contains(github.event.comment.body, '- [x] Force review'))
      && (github.event_name != 'issue_comment' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || (github.event.issue.pull_request && github.event.action == 'edited' && github.event.comment.user.login == 'manki-review[bot]'))
      && (github.event_name != 'pull_request_review_comment' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: manki-${{ (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && (contains(github.event.comment.body, 'manki review') || contains(github.event.comment.body, '- [x] Force review')))) && 'review' || 'reply' }}-${{ github.event.pull_request.number || github.event.issue.number }}
      queue: max
    timeout-minutes: 30
    cache-mode: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Install Claude Code CLI
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        # The pin mirrors the runtime fallback in `src/providers/anthropic.ts`.
        # If you update `CLAUDE_CLI_VERSION` in `src/providers/anthropic.ts`, update the version here too.
        run: npm install -g '@anthropic-ai/claude-code@2.1.318'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Install Codex CLI
        if: env.OPENAI_OAUTH_TOKEN != ''
        # Pin and `--ignore-scripts` mirror the runtime fallback in `src/providers/openai.ts`.
        # If you update `CODEX_CLI_VERSION` in `src/providers/openai.ts`, update the version here too.
        run: npm install -g --ignore-scripts '@openai/codex@0.166.0'
        env:
          OPENAI_OAUTH_TOKEN: ${{ secrets.OPENAI_OAUTH_TOKEN }}
      - name: Install Gemini CLI
        if: env.GEMINI_OAUTH_TOKEN != ''
        # Pin and `--ignore-scripts` mirror the runtime fallback in `src/providers/gemini.ts`.
        # If you update `GEMINI_CLI_VERSION` in `src/providers/gemini.ts`, update the version here too.
        run: npm install -g --ignore-scripts '@google/gemini-cli@0.66.0'
        env:
          GEMINI_OAUTH_TOKEN: ${{ secrets.GEMINI_OAUTH_TOKEN }}
      - name: Manki Review
        uses: ./  # Use local action for self-testing
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          openai_oauth_token: ${{ secrets.OPENAI_OAUTH_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          gemini_oauth_token: ${{ secrets.GEMINI_OAUTH_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          memory_repo_token: ${{ secrets.REVIEW_MEMORY_TOKEN }}
