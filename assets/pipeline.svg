<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ba3b0"/>
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Top row: stages -->
  <!-- Planner -->
  <rect x="5" y="20" width="145" height="52" rx="6" fill="#29362B" stroke="#3a4d3d" stroke-width="1.5"/>
  <text x="77.5" y="51" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Planner</text>
  <line x1="150" y1="46" x2="167" y2="46" stroke="#9ba3b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Finders -->
  <rect x="170" y="20" width="145" height="52" rx="6" fill="#29362B" stroke="#3a4d3d" stroke-width="1.5"/>
  <text x="242.5" y="51" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Finders</text>
  <line x1="315" y1="46" x2="332" y2="46" stroke="#9ba3b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dedup -->
  <rect x="335" y="20" width="145" height="52" rx="6" fill="#29362B" stroke="#3a4d3d" stroke-width="1.5"/>
  <text x="407.5" y="51" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Dedup</text>
  <line x1="480" y1="46" x2="497" y2="46" stroke="#9ba3b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Judge -->
  <rect x="500" y="20" width="145" height="52" rx="6" fill="#29362B" stroke="#3a4d3d" stroke-width="1.5"/>
  <text x="572.5" y="51" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Judge</text>
  <line x1="645" y1="46" x2="662" y2="46" stroke="#9ba3b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Verdict reader -->
  <rect x="665" y="20" width="145" height="52" rx="6" fill="#29362B" stroke="#3a4d3d" stroke-width="1.5"/>
  <text x="737.5" y="51" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Verdict reader</text>
  <line x1="810" y1="46" x2="827" y2="46" stroke="#9ba3b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Review posted -->
  <rect x="830" y="20" width="145" height="52" rx="6" fill="#29362B" stroke="#3a4d3d" stroke-width="1.5"/>
  <text x="902.5" y="51" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Review posted</text>

  <!-- Vertical arrows: stage → description -->
  <line x1="77.5" y1="72" x2="77.5" y2="108" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow-down)"/>
  <line x1="242.5" y1="72" x2="242.5" y2="108" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow-down)"/>
  <line x1="407.5" y1="72" x2="407.5" y2="108" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow-down)"/>
  <line x1="572.5" y1="72" x2="572.5" y2="108" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow-down)"/>
  <line x1="737.5" y1="72" x2="737.5" y2="108" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow-down)"/>
  <line x1="902.5" y1="72" x2="902.5" y2="108" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow-down)"/>

  <!-- Bottom row: descriptions -->
  <!-- Planner desc -->
  <rect x="5" y="112" width="145" height="80" rx="6" fill="#1a1d23" stroke="#3a4d3d" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="77.5" y="142" text-anchor="middle" fill="#9ba3b0" font-size="13">triages the change,</text>
  <text x="77.5" y="160" text-anchor="middle" fill="#9ba3b0" font-size="13">sets team + effort</text>

  <!-- Finders desc -->
  <rect x="170" y="112" width="145" height="80" rx="6" fill="#1a1d23" stroke="#3a4d3d" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="242.5" y="142" text-anchor="middle" fill="#9ba3b0" font-size="13">one or two finders</text>
  <text x="242.5" y="160" text-anchor="middle" fill="#9ba3b0" font-size="13">review in parallel</text>

  <!-- Dedup desc -->
  <rect x="335" y="112" width="145" height="80" rx="6" fill="#1a1d23" stroke="#3a4d3d" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="407.5" y="142" text-anchor="middle" fill="#9ba3b0" font-size="13">drops repeats of</text>
  <text x="407.5" y="160" text-anchor="middle" fill="#9ba3b0" font-size="13">resolved findings</text>

  <!-- Judge desc -->
  <rect x="500" y="112" width="145" height="80" rx="6" fill="#1a1d23" stroke="#3a4d3d" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="572.5" y="142" text-anchor="middle" fill="#9ba3b0" font-size="13">filters noise,</text>
  <text x="572.5" y="160" text-anchor="middle" fill="#9ba3b0" font-size="13">grades findings</text>

  <!-- Verdict reader desc -->
  <rect x="665" y="112" width="145" height="80" rx="6" fill="#1a1d23" stroke="#3a4d3d" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="737.5" y="142" text-anchor="middle" fill="#9ba3b0" font-size="13">reads the diff cold</text>
  <text x="737.5" y="160" text-anchor="middle" fill="#9ba3b0" font-size="13">when nothing blocks</text>

  <!-- Review posted desc -->
  <rect x="830" y="112" width="145" height="80" rx="6" fill="#1a1d23" stroke="#3a4d3d" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="902.5" y="142" text-anchor="middle" fill="#9ba3b0" font-size="13">review threads +</text>
  <text x="902.5" y="160" text-anchor="middle" fill="#9ba3b0" font-size="13">body + verdict</text>
</svg>
