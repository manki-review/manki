must_catch:
  - id: K1
    severity: warning
    mechanism: "`lockfileSignals` gives every flagged change `line: c.line ?? 1` and the same `ruleId` `lockfile-change`, and `toolAlertFindings` dedups on `file:line:ruleId`. When a lockfile has no per-package line numbers, such as a compact one-line `package-lock.json`, every flagged change sits on line 1 and only the first becomes a finding, so the other suspicious packages get no alert."
    locations: ["src/lockfile.ts", "lockfileSignals", "src/static-signals.ts", "toolAlertFindings"]
    fix: "a625b8b2859fddc1c252d1e2aaa0038c352b587c"
  - id: K2
    severity: warning
    mechanism: "`diffEntries` pairs removed and added entries of one name only when both sides hold the same number of versions, and only paired entries go through `changeFlags`, which raises `downgrade`. When the count differs, for example `syn 2.0.60` becoming `syn 1.0.109` and `syn 2.0.10`, the entries are listed as plain removals and additions and the downgrade is never flagged."
    locations: ["src/lockfile.ts", "diffEntries", "changeFlags"]
    fix: "29bb4ec602fe95c11018282be9152fd6dc5aa111"
