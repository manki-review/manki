must_catch:
  - id: K1
    severity: warning
    mechanism: "The reorder in `TrySignInstantSendLock` works around the symptom. The flaky `wait_for_instantlock` in `interface_zmq_dash.py` fails on the node that runs `-watchquorums`, and that node has no `InstantSendSigner` (only the masternode context in `src/active/context.cpp` creates one), so the changed code never runs there. The cause is the inv filter in `src/net_processing.cpp`: `PushInv` (line 1209) and `SendMessages` (line 6353) skip every `MSG_ISDLOCK` inv to a peer with `m_wants_recsigs`. A `-watchquorums` node sends `QSENDRECSIGS` but cannot rebuild a lock from the recovered signature, so it never learns of the InstantSend lock. The skip has to apply only to a peer that is a verified masternode."
    locations: ["src/net_processing.cpp", "PushInv", "SendMessages", "m_wants_recsigs", "src/instantsend/signing.cpp", "TrySignInstantSendLock"]
    fix: "f6bb02d666b0d40b0a290b72d40b912bcee32e18"
