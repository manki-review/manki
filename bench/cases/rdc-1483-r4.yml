    - id: P15
      severity: warning
      title: Expired bans and failed dials permanently grow the ban table
      file: dash-spv/src/network/bans.rs
      line: 49
      grade_if_confirmed: warning
      cell:
        row: degraded
        column: normal
      doubts:
        - premise: The discoverer can hand the supervisor an unbounded number of distinct addresses over the client's lifetime, so failed dials keep adding new entries
          decides: defect
        - premise: "This trigger happens in realistic use: when a long-running client keeps dialing new gossiped addresses that fail or get banned"
          decides: defect
      posted: thread
      state: resolved
      description: Each distinct address passed to the public `ban_peer` method or encountered on a failed dial adds a table entry. Expiry filters the returned set but leaves the stored entry in place, so a long-running client that sees new addresses uses memory proportional to all addresses it has ever backed off or banned and scans that history on each candidate pass. Even one million expired addresses still occupy one million entries.
      how_to_fix: Reclaim expired bans and bound retained dial-failure history independently of active bans. Set an explicit budget for active bans and define overflow behavior that does not silently lift an existing ban.
      evidence_files:
        - dash-spv/src/network/mod.rs
        - dash-spv/src/network/manager.rs
        - dash-spv/src/network/discovery.rs
