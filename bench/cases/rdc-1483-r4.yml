      description: "`judge()` includes departed connection IDs so the monitor can recover their requests, but the monitor treats those IDs as ban-worthy kicks. A connection can also leave between the monitor's snapshot and removal through a disconnect, swap, or stop. The stale ID puts the address on a ten-minute ban even if removal finds no peer, and a successful replacement handshake now preserves that ban."
      how_to_fix: Separate request cleanup for departed IDs from timeout eviction. Revalidate the selected connection under the peer-set lock and publish its ban as part of the same transition that removes it, so stale IDs only trigger request cleanup.
