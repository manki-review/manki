    - id: P7
      severity: warning
      title: A successful handshake keeps dial backoff from another attempt
      file: dash-spv/src/network/bans.rs
      line: 62
      grade_if_confirmed: warning
      cell:
        row: degraded
        column: normal
      doubts:
        - premise: a caller of `NetworkManager::start` calls it twice in one session without `stop`, so two supervisors dial the same address concurrently
          decides: defect
        - premise: "This trigger happens in realistic use: the sequence of events the description names"
          decides: defect
      posted: thread
      state: fixed
      description: The live expiry can be a dial backoff, not a misconduct ban. Two calls to the public `start()` can launch supervisors that select the same address before either attempt finishes. If one attempt fails before the other succeeds, the success leaves the address ineligible for up to 60 seconds after its connection drops, even for a configured peer that cannot receive a misconduct ban.
      how_to_fix: Track the dial backoff deadline separately from the misconduct ban deadline, and clear both the backoff deadline and failure count on a successful handshake. Candidate selection should honor either deadline while it is active.
      evidence_files:
        - dash-spv/src/network/manager.rs
        - dash-spv/src/network/mod.rs
        - dash-spv/src/network/discovery.rs
    - id: P8
      severity: warning
      title: Timeout cleanup can ban an address without kicking a peer
      file: dash-spv/src/network/manager.rs
