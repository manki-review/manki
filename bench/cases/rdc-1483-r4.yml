# Manki 7.7.4 posted the growth of the ban table again in this round. The threads of rounds 1 and 3 on it (P2, P15) were
# agreed as later work in a tracking issue and resolved, and the push did not change how entries are removed.
id: rdc-1483-r4
repo: xdustinface/rust-dashcore
source: rust-dashcore upstream PR 1483, round 4 by Manki 7.7.4, every comment checked against the code
base: efb46a538f1c68b2c2ae2ddcf8277bfc8df6821f
head: a8dc1f07dae42429d29623cabc7efd23a91a8644
title: "fix(dash-spv): keep bans in force across a redial"
body: |
  A successful handshake erased any ban recorded while the dial was in flight. `Bans::dialed` deleted the address's whole entry to reset its dial backoff, and `connect` starts the peer's reader before it returns. So a peer that sends an undecodable message right after its handshake was banned for misbehaving and then unbanned straight away, free to be redialed on the next fill round. A kick or `ban_peer` landing in that window was lost the same way.

  The ban table now keeps the dial backoff and the ban apart. A handshake clears only the backoff, and the peer set refuses a peer whose address is banned. It reads the ban under its own lock, so a ban recorded after that read finds the peer in the set and `ban_peer` closes it. A timeout kick also records its ban before it drops the peer from the set, instead of after re-queueing its work, so the supervisor's read of the live set and the bans always sees a kicked peer in one of them.

  Upstream PR 1482 reads the live set before the bans when it picks candidates. That read sees every kicked peer only when the ban lands before the removal, which is the order this PR gives the timeout monitor.
