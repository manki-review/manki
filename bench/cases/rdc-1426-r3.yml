# Manki 7.7.5 posted two warnings in this round that a good round leaves out. One needs the filter tip lookup to fail,
# which only reads a cached height. The other needs a disk write to fail on a fresh chain, in code the PR left as it was.
id: rdc-1426-r3
repo: xdustinface/rust-dashcore
source: rust-dashcore upstream PR 1426, round 3 by Manki 7.7.5, every comment checked against the code
base: faaca5f1b300a279f40ed55a3f0ac90f74bf1e0f
head: d31ec981450f9216f70fd0a3877e22563060db0c
title: "fix(dash-spv): tell an empty filter header store from genesis"
body: |
  Filter header sync treated an empty filter header store and one holding only the genesis filter header the same way, because it read the stored tip as 0 in both cases.

  Over a stored genesis header, `start_download` restarted at height 0 and rewrote it, which panics in debug builds. Over an empty store, `handle_new_headers` took a block header tip of 0 as caught up. On a new regtest or devnet chain holding only genesis, the sync completed without the genesis filter header, then rejected every batch from height 1 and requested it again forever.

  Both paths now take the next height from the stored tip as an `Option`. A dashd test syncs a client on a genesis-only chain and checks that it follows the next two blocks.

  Closes upstream issue 1397
