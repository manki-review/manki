    severity: warning
    mechanism: "The PR fixes a bug in the `jest-circus` package and does not change `CHANGELOG.md`. The repository's `CONTRIBUTING.md` requires a changelog entry for every change that adds a feature to or fixes a bug in one of Jest's packages, with the package names, a description and the link to the pull request. The fix is released without a line in the changelog."
    locations: ["CHANGELOG.md", "packages/jest-circus/src/eventHandler.ts", "packages/jest-circus/src/__tests__/eventHandler.test.ts"]
