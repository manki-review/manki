id: rdc-1178
repo: xdustinface/rust-dashcore
source: rust-dashcore upstream PR 1178, replayed as fork PR xdustinface/rust-dashcore#184
base: 6b7bde74ee33ff85574cd44eaa3efed719ca84cc
head: 56106419105f25aa2ffba02dee7eef64c39758c5
title: "fix(dash-spv): make stop wait for the tasks the sync loop detaches"
body: |
  The sync loop runs fork recovery (`handle_fork`) and the stop of a failed loop (`stop_failed`) in detached tasks. Each holds a client clone, and with it the storage and its lock file. `stop()` didn't wait for them, so it could return while they still held the lock (upstream platform issue 5381).

  - Those tasks now go into a `JoinSet` on the client.
  - `stop()` joins them after releasing the `sync_loop` lock, which they take themselves. With the loop already taken, they return without acting.

  Closes upstream issue 1171
# Overrides the repository's `.manki.yml` at the base, which sets `critical` on classes and no longer loads. Holds the
# settings the repository uses now, which name the same paths in `review.critical_paths`.
config:
  auto_review: true
  auto_approve: true
  exclude_paths:
    - "*.lock"
    - "dist/**"
    - "*.generated.*"
    - "fuzz/**"
  skip_authors: ["dependabot[bot]", "github-actions[bot]"]
  instructions: |
    This is a Rust implementation of the Dash cryptocurrency protocol.
    Pay special attention to:
    - Consensus-critical code paths — changes here can cause chain splits
    - Proper error handling — prefer Result over unwrap/expect in library code
    - DIP (Dash Improvement Proposal) compliance for protocol changes
    - Memory safety in hash/crypto implementations
  review:
    classes:
      security:
        match: { paths_any: ["key-wallet/**", "key-wallet-manager/**", "dash/src/crypto/**", "crypto/**"] }
      wallet:
        rank: 86
        match: { paths_any: ["key-wallet/**", "key-wallet-manager/**", "dash/src/crypto/**", "crypto/**"] }
      consensus:
        rank: 85
        match: { paths_any: ["dash/src/consensus/**", "dash/src/blockdata/**", "dash/src/sml/**", "dash/src/merkle_tree/**", "hashes/**"] }
    routing:
      wallet: pair
      consensus: pair
    critical_paths: ["key-wallet/**", "key-wallet-manager/**", "dash/src/crypto/**", "crypto/**", "dash/src/consensus/**", "dash/src/blockdata/**", "dash/src/sml/**", "dash/src/merkle_tree/**", "hashes/**"]
    outside_input: >-
      Anything a network peer sends: P2P messages, blocks, transactions, headers,
      masternode list diffs and the length prefixes inside them. Responses from a
      Dash Core RPC server. Files read from disk, such as stored headers, filters
      and wallet data.
    examples:
      blocker:
        - "Indexing `buf[len]` with a length read from a peer message panics on a short message."
        - "`Vec::with_capacity` sized by a count a peer sends lets one message allocate gigabytes."
        - "Changing the field order in a `consensus_encode` implementation changes the bytes on the wire, even when every test passes."
        - "A signature check whose failure is ignored accepts a forged message."
        - "An inverted peer selection weight, such as `score + offset` where a lower score is better, picks misbehaving peers more often than well-behaved ones."
      not_blocker:
        - "A `todo!()` the PR states is intentional: `suggestion` at most."
        - "An `expect` right after a bounds check that proves it cannot fail."
        - "A missing test for new code: `suggestion`."
        - "A missing `#[must_use]` or missing docs: `nitpick`."
  related_repos:
    - { repo: dashpay/dash, kind: reference, paths: [src/] }
    - { repo: dashpay/dips, kind: reference }
    - { repo: dashpay/platform, kind: consumer, paths: ["packages/rs-*"] }
    - { repo: dashpay/dash-evo-tool, kind: consumer }
  static_analysis:
    analyzers:
      secrets: true
  memory:
    enabled: true
key_version: 2
must_catch:
  - id: K1
    severity: blocker
    mechanism: "`stop()` joins the detached tasks while holding `detached_tasks`, but `run()` can take `sync_loop` in the meantime. A detached `stop_failed` or `handle_fork` then acts on whichever loop is in `sync_loop`, so it can wait on a new loop whose own spawn blocks on `detached_tasks`: a deadlock, or `stop()` returns with a loop still running and holding the storage."
    locations: ["dash-spv/src/client/lifecycle.rs", "dash-spv/src/client/sync_coordinator.rs", "detached_tasks", "stop_failed", "handle_fork"]
    fix: "9d0d4d5a9"
nice_to_have:
  - id: N1
    severity: suggestion
    mechanism: "The test `stop_waits_for_detached_tasks` pushes a task straight into the private field, so it exercises neither real spawn site in `sync_coordinator.rs`. Reverting them leaves it green."
    locations: ["stop_waits_for_detached_tasks", "dash-spv/src/client/mod.rs"]
    fix: "9d0d4d5a9"
  - id: N2
    severity: nitpick
    mechanism: "Style: the `Arc::clone` and the new `use std::sync::Arc` in `sync_coordinator.rs` are unneeded, the new `detached_tasks` field has no doc comment, and the test uses inline paths (`std::time::Duration`, `tokio::time::sleep`)."
    locations: ["dash-spv/src/client/sync_coordinator.rs", "dash-spv/src/client/mod.rs"]
  - id: N3
    severity: suggestion
    mechanism: "The `JoinSet` of detached tasks is drained only by `stop`."
    locations: ["dash-spv/src/client/core.rs", "detached_tasks"]
    source: "owner /check review"
  - id: N4
    severity: nitpick
    mechanism: "The test duplicates its client setup."
    locations: ["dash-spv/src/client/mod.rs", "stop_waits_for_detached_tasks"]
    source: "owner /check review"
