# This case measures whether one round finds every instance of one defect class: input a pull request author controls
# makes a scan in src/symbol-uses.ts super-linear. Manki found these one per round over nine rounds. The same-class
# step of manki-review/manki#1318 is tuned against this case, so it stays in the tuning set.
id: manki-1289
repo: manki-review/manki
source: manki PR 1289, round 1
base: 1e6103800e0680d13890aef05c2ca18961d04b84
head: cc00362db19a2df3e65f15d3410ed3b3765a711f
title: "feat: rank redefined field uses, add Python and Go"
body: |
  ## Summary

  The "Uses Outside the Diff" list now ranks the readers of a field or variant whose meaning the diff changes by whether their file names the changed type, shows more of them, and says how many were cut. Sibling field and sibling implementation detection now covers Python and Go, and other languages get a conservative line-based fallback for sibling fields. The test fixtures in `symbol-uses.test.ts` and `compare.test.ts` are rewritten with neutral Rust, TypeScript, Python, Go, Java and C# code.

  ## Changes

  - **Rank uses by type.** For a redefined field or variant, a use in a file that also names the declaring type ranks first, and a use in a file that never names it ranks last with the existing unreachable-package namesakes. Such a field shows up to 12 uses instead of 4, still inside the 60-line total, and the cut note says how many of the uses left out sit in files that name the type. Each field's heading now names its type, such as `(field of `Order`)`.
    - Defect class: stale readers of a field whose meaning, units or serialization changed while its name stayed.
    - Example elsewhere: a TypeScript API makes `profile.nickname` display-only. Readers in files that import `Profile` matter, while `pet.nickname` reads in unrelated files used to fill the 4 slots.
    - Could make worse: a longer uses section and some cost. A namesake in a file that also names the type still ranks high.
  - **Python.** Fields are class-body assignments and `self` assignments in `__init__`, typed by annotation or by the kind of their first value (`{}` is `dict`). Lookups cover `in` and `not in`, subscripts, and `get`, `pop`, `setdefault`, `discard`, `append` and `index`. Python classes are listed with their fields. A `test_*.py` file counts as a test.
  - **Go.** Loads the pinned `@ast-grep/lang-go@0.0.6` grammar beside Python and Rust (one more ~330 KB SHA-512 pinned download, in parallel). Covers struct fields, map index lookups, `delete` and `append`, `sync.Map` methods, and methods of one name on sibling receiver types. `[32]byte` is a value, not a collection. The `ast_grep` repository tool can now search Go too. `isAstGrepFile` now also requires a rule for the language, so a Go-only PR does not load ast-grep for static analysis that has no Go rules.
    - Defect class for Python and Go: a lookup that checks one collection while the item can sit in a sibling one, and one implementation missing a check its siblings have.
    - Example elsewhere: a Python worker pool checks `worker_id in self.idle` but never `self.retired`. A Go `Close` deletes from `r.active` while closed sessions sit in `r.expired`.
    - Could make worse: more comparison calls on Python and Go PRs, within the existing cap of 6 per kind. A Python field without an annotation is compared only with a field holding the same kind of value, so `set()` against `{}` is never asked about.
  - **Fallback for other languages** (second commit). Lookups come from added lines, such as `jobs.get(id)`, `this.jobs.containsKey(id)` or `jobs_[id]`. The class comes from the nearest less indented line that opens one, so a local variable in a method never counts. A question is asked only for a field declared with the very same collection type, and these lookups queue after parsed ones.
    - Example elsewhere: a Java `SessionStore.close` checks `live.containsKey(id)` while a `closed` map of the same type holds ended sessions.
    - Could make worse: a few extra questions in Java, C#, C++ or Kotlin code, limited by the same-type rule. Fields declared without an explicit type, such as Kotlin `val x = mutableMapOf()`, are missed.
  - **Neutral fixtures and text.** The replay-derived names are gone from the two test files, the reference-search prompt sentence, doc comments, `docs/how-reviews-work.md`, and `GENERIC_NAMES`, which no longer special-cases `consensus_encode` and `consensus_decode` (the 80-use cutoff covers a name that common).

  The targeted comparison call for a lowered or added limit (item 3 of the issue) follows in a separate PR.

  ## Testing

  `npx jest` on the touched files passes: `symbol-uses.test.ts`, `compare.test.ts`, `ast-grep.test.ts`, `mcp-server.test.ts` and `static-signals.test.ts` (60 tests). New cases cover the type-first ranking in Rust and TypeScript, the 12-use cap and its cut note, Python and Go sibling fields and implementations, Go fixed-size arrays, and the Java and C# fallback including a method-local map that must not count.

  Part of #1284, whose item 3 follows in a second PR that closes it.
  Part of #1281
