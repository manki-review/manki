must_catch:
  - id: K1
    severity: blocker
    mechanism: '`LINE_LOOKUP` puts `\s*`, a lazy run of any character but brackets, commas, semicolons and backticks, which also matches spaces, and another `\s*` in a row before a required `,` or `)`. `lineLookups` runs it with the `g` flag on every added line, so a long run of spaces without a closing `,` or `)` backtracks cubically and hangs the review before any model runs.'
    locations: ["src/symbol-uses.ts", "lineLookups", "LINE_LOOKUP"]
    fix: "da19c894cc78f561ceca34d855224d0d1af85c8f"
  - id: K2
    severity: blocker
    mechanism: 'The Go `receiver` rule strips type arguments with `.replace(/\[[\s\S]*\]$/, '''')`. On a receiver type with many `[` that does not end in `]`, such as `[][][]...T`, every `[` scans to the end of the text and fails, so the time grows with the square of the type''s length. `methods()` runs it for every method in the changed Go files and the files beside them.'
    locations: ["src/symbol-uses.ts", "receiver", "methods"]
    fix: "69d7671b42f7e124d45c943b7bff1d459d20ba00"
  - id: K3
    severity: blocker
    mechanism: '`collectionLookups` calls `named(parent)` for every member access inside a call''s arguments, a subscript or a membership test, before it checks that the access is the first operand. Each call lists every sibling, so one call with k member-access arguments, a Python subscript `x[a.b, a.c, ...]` or a chained `in` comparison costs k squared nodes.'
    locations: ["src/symbol-uses.ts", "collectionLookups", "named(parent)"]
    fix: "c30415c33046e9f47b12b5844ce6b281438ea48a"
  - id: K4
    severity: blocker
    mechanism: '`collectionLookups` copies `call.field(''function'')?.text()` for every access whose grandparent is a call, and `item?.text()` before the `MAX_ITEM_CHARS` check. In a fluent chain such as `b.a(x.y).b(x.y)...` each callee is the whole chain before it, and in nested subscripts such as `a.m[a.m[...]]` each item is the rest of the expression, so the copied text grows with the square of the expression.'
    locations: ["src/symbol-uses.ts", "collectionLookups", "MAX_ITEM_CHARS"]
    fix: "d40836175b981fc4f81ffc30e59038623ef8a17e"
  - id: K5
    severity: blocker
    mechanism: '`changedDeclarations` spreads the whole `touched` set into a new array in `touches`, twice for every declaration, and its second loop runs `changed.some` over all changed symbols for each declaration. A large added file with many one-line fields or Go `const` specs costs declarations times touched lines.'
    locations: ["src/symbol-uses.ts", "changedDeclarations", "touches"]
    fix: "716adcf2110c1fdc2286cb952619cf9238808ca1"
  - id: K6
    severity: blocker
    mechanism: '`structsDeclaringField` calls `fieldContainer` for every grep hit whose line matches `fieldLine`, and `fieldContainer` scans every declaration of the file with `find`, calling `range()` on each. `structListing` then scans all declarations again. One large struct of matching field lines read on a changed line costs hits times declarations.'
    locations: ["src/symbol-uses.ts", "structsDeclaringField", "fieldContainer", "structListing"]
    fix: "716adcf2110c1fdc2286cb952619cf9238808ca1"
  - id: K7
    severity: blocker
    mechanism: '`ParsedFile` walks `node.ancestors()` for every node it checks: in `declaration` to find the container, and in `inTests` for every declaration and every member access. A deep syntax tree, such as Go anonymous struct fields nested thousands of levels or a long `a.b.c...` chain, makes the total walk grow with the square of the depth.'
    locations: ["src/symbol-uses.ts", "inTests", "ancestors"]
    fix: "bfb585ec294ada6d04090155f07c886ea5c059ec"
  - id: K8
    severity: blocker
    mechanism: '`siblingImplementations` adds each method with `groups.set(key, [...groups.get(key) ?? [], m])`, copying the whole group on every insert. A generated Go file where every type has `String()` or `Reset()`, plus the files beside it, makes the copies grow with the square of the group size.'
    locations: ["src/symbol-uses.ts", "siblingImplementations", "groups.set"]
    fix: "cd58d9a25bce3b7b5560c5e5cf736b66d1f5e595"
