nice_to_have:
  - id: N1
    severity: warning
    mechanism: "A peer can send an `InstantLock` for a wallet transaction whose `cyclehash` names a cycle the engine does not hold. `process_instantlock` keeps it pending and emits `InstantLockReceived` with `validated: false`. The mempool manager ignores `validated`, so the wallet marks the transaction InstantSend-locked. When a held quorum later refutes the lock, `validate_pending` only drops the cached entry and tells the wallet nothing. The gap is older than the PR: the base also passed unvalidated locks to the mempool manager."
    locations: ["dash-spv/src/sync/instantsend/manager.rs", "process_instantlock", "validate_pending", "dash-spv/src/sync/mempool/sync_manager.rs", "process_instant_send"]
