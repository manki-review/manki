head: 9762c89496ebe924efcf336a0d0c918b3b6c9abe
title: "chore: release `v0.46.1`"
body: |
  Releases `v0.46.1`, a patch release on top of `v0.46.0` for Dash Platform 5.1. It ships the InstantSend fix from upstream PR 1419 without the 0.47 API changes on `dev`, so Platform can take it without porting to 0.47 first.

  The branch is `master` (`v0.46.0`) plus 17 fixes cherry-picked from `dev` with `-x`, in `dev` order, and the `0.46.1` changelog. Nothing in it touches signature verification, BIP39 seed derivation or the crypto dependencies, so Platform signs, derives keys and verifies with the same code as on `v0.46.0`. The high-S fix (upstream PR 1379) and the BIP39 seed derivation rewrite (upstream PR 1393) stay out for that reason and ship with 0.47.

  Four picks needed hand edits:
  - upstream PR 1418 and upstream PR 1399: import conflicts in test code.
  - upstream PR 1419: the v6 storage migration that deletes the masternode snapshot is left out, and storage stays at version 3. Shipping it here as version 4 would make 0.47 skip its own v4 checksum migration. The snapshot format still changes, so 0.46.0 snapshots fail to decode and are removed and resynced on first start, as before.
  - upstream PR 1447 and upstream PR 1454: their tests pass the `add_to_state` argument that 0.46.0 still has.

  It also backports the release automation from upstream PR 1406, so this is its first run, upstream PR 1411, which fixes the lockfile check, and upstream PR 1428, which replaces the `chrono` crate the security audit now flags as unmaintained. Their workflows use the action versions `v0.46.0` already locks.

  Merge with a merge commit, not a squash. The `Release` workflow then waits for approval, tags the merge commit `v0.46.1`, publishes the release and opens a PR that brings the changelog to `dev`. The PRs listed in the `0.46.1` section must stay out of the `0.47.0` section, and `Release Check` enforces that.
