must_catch:
  - id: K1
    severity: note
    mechanism: "The nil check in `getTypeOfNode` hides the symptom. The symbol is nil because `ast.IsTypeDeclaration` (`tsc/internal/ast/utilities.go` line 3632) returns true for every type-only `ImportClause`, while the binder declares a symbol for an import clause only when it has a default binding. So `import type { U }` and `import type * as ns` are classified as type declarations that declare nothing, and every reader of `IsTypeDeclaration` has to guard against that. `IsTypeDeclaration` should return true for a type-only clause only when it has a default binding. The clause then takes the same path as a regular import clause, and the guard is not needed."
