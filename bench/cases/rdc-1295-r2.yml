    severity: blocker
    mechanism: "The owner check in `settle_outputs_held_elsewhere` reads only the owner's `utxos`. When the owning account holds the output in `spent_before_funded`, in `claim_guarded_outputs` or only in `spent_outpoints`, the copy in another funding account stays spendable and counted in the balance."
    locations: ["key-wallet/src/managed_account/managed_account_collection.rs", "settle_outputs_held_elsewhere", "spent_before_funded", "claim_guarded_outputs", "spent_outpoints"]
    fix: "095f7f208"
  - id: K2
    severity: warning
    mechanism: "A reservation on the moved outpoint stays in the other account, since `reservations` is kept per account, so a transaction built while it is reserved can be rejected."
    locations: ["key-wallet/src/managed_account/managed_account_collection.rs", "settle_outputs_held_elsewhere", "reservations"]
    source: "Manki v7.3.2 round 2, checked in the replay scorecard"
