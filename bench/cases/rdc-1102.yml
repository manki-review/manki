id: rdc-1102
repo: xdustinface/rust-dashcore
source: rust-dashcore upstream PR 1102, replayed as fork PR xdustinface/rust-dashcore#185
base: 2322ef8b4b1e75a8c4adff7e80ef6b42d63a21a1
head: 630a8275eec7f34ea4382211b773ec4e95474764
title: "fix(dash-spv): follow the network onto a branch that replaces stored blocks"
body: |
  When the network reorganized onto a branch that replaces blocks the client already stored, the client stayed on the old branch for good. The headers of the new branch do not connect to any segment of the header pipeline, so they were dropped with a "no segment matched" warning, every time.

  The block headers manager now looks up where such headers branch off: past the headers it already stores, if the parent of the first unknown one is stored below the tip, it emits `SyncEvent::ForkDetected` with that height. The sync loop then hands it to `handle_fork()`, which, under the lifecycle lock, stops the client, truncates the stored headers, filter headers, filters and blocks above the fork, and runs the client again, so it syncs onto the branch the network follows. To run again without releasing the lock, `run()` now delegates to `run_locked()`.

  The wallet is not rewound: its synced height only moves forward, so the blocks of the new branch below its old height are not rescanned, and transactions of the dropped blocks stay as they were.

  `test_sync_follows_reorg` makes dashd replace its last 3 blocks with a branch of 5 and requires the client to end on the new tip. Without this change it times out with the client still on the old branch.
# Overrides the repository's `.manki.yml` at the base, which sets `critical` on classes and no longer loads. Holds the
# settings the repository uses now, which name the same paths in `review.critical_paths`.
config:
  auto_review: true
  auto_approve: true
  exclude_paths:
    - "*.lock"
    - "dist/**"
    - "*.generated.*"
    - "fuzz/**"
  skip_authors: ["dependabot[bot]", "github-actions[bot]"]
  instructions: |
    This is a Rust implementation of the Dash cryptocurrency protocol.
    Pay special attention to:
    - Consensus-critical code paths — changes here can cause chain splits
    - Proper error handling — prefer Result over unwrap/expect in library code
    - DIP (Dash Improvement Proposal) compliance for protocol changes
    - Memory safety in hash/crypto implementations
  review:
    classes:
      security:
        match: { paths_any: ["key-wallet/**", "key-wallet-manager/**", "dash/src/crypto/**", "crypto/**"] }
      wallet:
        rank: 86
        match: { paths_any: ["key-wallet/**", "key-wallet-manager/**", "dash/src/crypto/**", "crypto/**"] }
      consensus:
        rank: 85
        match: { paths_any: ["dash/src/consensus/**", "dash/src/blockdata/**", "dash/src/sml/**", "dash/src/merkle_tree/**", "hashes/**"] }
    routing:
      wallet: pair
      consensus: pair
    critical_paths: ["key-wallet/**", "key-wallet-manager/**", "dash/src/crypto/**", "crypto/**", "dash/src/consensus/**", "dash/src/blockdata/**", "dash/src/sml/**", "dash/src/merkle_tree/**", "hashes/**"]
    outside_input: >-
      Anything a network peer sends: P2P messages, blocks, transactions, headers,
      masternode list diffs and the length prefixes inside them. Responses from a
      Dash Core RPC server. Files read from disk, such as stored headers, filters
      and wallet data.
    examples:
      blocker:
        - "Indexing `buf[len]` with a length read from a peer message panics on a short message."
        - "`Vec::with_capacity` sized by a count a peer sends lets one message allocate gigabytes."
        - "Changing the field order in a `consensus_encode` implementation changes the bytes on the wire, even when every test passes."
        - "A signature check whose failure is ignored accepts a forged message."
        - "An inverted peer selection weight, such as `score + offset` where a lower score is better, picks misbehaving peers more often than well-behaved ones."
      not_blocker:
        - "A `todo!()` the PR states is intentional: `suggestion` at most."
        - "An `expect` right after a bounds check that proves it cannot fail."
        - "A missing test for new code: `suggestion`."
        - "A missing `#[must_use]` or missing docs: `nitpick`."
  related_repos:
    - { repo: dashpay/dash, kind: reference, paths: [src/] }
    - { repo: dashpay/dips, kind: reference }
    - { repo: dashpay/platform, kind: consumer, paths: ["packages/rs-*"] }
    - { repo: dashpay/dash-evo-tool, kind: consumer }
  static_analysis:
    analyzers:
      secrets: true
  memory:
    enabled: true
key_version: 2
must_catch:
  - id: K1
    severity: warning
    mechanism: "An error from `stop_locked` in `handle_fork` returns early through `?` after the loop was taken out of `sync_loop`, so truncation and restart never run and the client stays stopped on the old branch."
    locations: ["dash-spv/src/client/lifecycle.rs", "handle_fork", "stop_locked"]
    fix: "a7ac6d6eb"
  - id: K2
    severity: warning
    mechanism: "`handle_fork` truncates chain storage but restarts with the same wallet state. A wallet synced past `fork_height` can skip replacement blocks, and transactions from removed blocks stay, leaving balances and confirmations stale. Acknowledged and deferred upstream."
    locations: ["dash-spv/src/client/lifecycle.rs", "handle_fork", "fork_height"]
  - id: K3
    severity: warning
    mechanism: "The fork-event receiver in `sync_coordinator.rs` only handles `Ok(ForkDetected)`. A `Lagged` error is ignored, so fork recovery can be skipped silently. Acknowledged and deferred upstream."
    locations: ["dash-spv/src/client/sync_coordinator.rs", "Lagged", "ForkDetected"]
  - id: K4
    severity: blocker
    mechanism: "Security (DoS): `ForkDetected` fires from an unmatched `Headers` message before `BlockHeaderValidator` runs. A peer sending one header whose parent is a stored block below the tip makes `handle_fork` truncate stored headers and filter data. A validated higher-work branch should be required before truncating. Acknowledged and deferred upstream."
    locations: ["dash-spv/src/sync/block_headers/manager.rs", "ForkDetected", "BlockHeaderValidator", "handle_fork"]
nice_to_have:
  - id: N1
    severity: warning
    mechanism: "Fork recovery fails when the fork height is below the first stored block or filter."
    locations: ["dash-spv/src/storage/segments.rs", "handle_fork"]
    source: "owner /check review"
  - id: N2
    severity: warning
    mechanism: "An honest sibling block at the same height triggers truncation, because `fork_height` returns any stored parent below the tip."
    locations: ["dash-spv/src/sync/block_headers/manager.rs", "fork_height"]
    source: "owner /check review"
  - id: N3
    severity: suggestion
    mechanism: "`CheckpointManager::should_reject_fork` is used only in tests, so recovery never checks a fork against the checkpoints."
    locations: ["dash-spv/src/chain/checkpoints.rs", "should_reject_fork"]
    source: "owner /check review"
  - id: N4
    severity: warning
    mechanism: "The FFI drops `SyncEvent::ForkDetected` with `=> {}`, so an FFI host never learns of a fork."
    locations: ["dash-spv-ffi/src/callbacks.rs", "ForkDetected"]
    source: "owner /check review"
  - id: N5
    severity: warning
    mechanism: "A concurrent `run()` races `handle_fork` and drops the fork recovery. Upstream found it only at a later head."
    locations: ["dash-spv/src/client/lifecycle.rs", "handle_fork", "run_locked"]
    source: "Manki v7.1.1 review and owner /check review"
