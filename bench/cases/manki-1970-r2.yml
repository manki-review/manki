    - id: P1
      severity: blocker
      title: A failed or interrupted record rewrite leaves a cleared thread with a non-settling reply record
      file: src/interaction.ts
      line: 701
      cell: { row: wrong, column: normal }
      posted: thread
      state: open
      description: "The answer is posted as `stays_resolved`, and only the later `rewrite(...)` turns it into `resolves`. If `updateReviewComment` fails, or the run is cancelled between the resolve and the rewrite, the thread is cleared by Manki but its record stays `stays_resolved`. `SETTLING_FATES` in `src/review-record.ts:62` holds only `resolves` and `already_resolved`, so `settlingDecision` returns nothing for that answer."
      how_to_fix: Accept the failed rewrite as a known gap and say so in the warning text. Alternatively, retry the `updateReviewComment` once before giving up.
      evidence_files: [src/review-record.ts, src/recap.ts, src/state.ts, src/index.ts]
    - id: P2
      severity: note
      title: Record can say `stays_resolved` after the reopen succeeded but the resolve threw
      file: src/interaction.ts
      line: 694
      cell: { row: improvement, column: normal }
      posted: body
      description: "`resolveThreadOf` reopens the thread at `src/interaction.ts:294` and then calls `resolveReviewThread` at `:295`. If that second call throws, the thread is left open, but the posted record already says `stays_resolved` and is never rewritten. Before this PR the record said `resolves` in this case, so the change reduces the wrong state but does not remove it."
      how_to_fix: Read the thread state again after a failed resolve, or rewrite the record to `stays_open` in the `catch` at line 695.
