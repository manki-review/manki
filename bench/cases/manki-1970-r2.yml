head: 4fc3f47947343ba63639c38b7f36e093af94c198
title: "fix: name the real thread state in the reply record"
body: |
  ## What changed

  The hidden reply record under Manki's thread answers now names the state the thread is really in:

  - A resolved blocking or security thread that keeps blocking after the answer is recorded as `stays_resolved`. Before, it said `stays_open`, although the thread stays resolved.
  - A maintainer's answer that clears such a thread is posted as `stays_resolved`, and its record is rewritten to `resolves` only once Manki's reopen and resolve went through. Before, the answer was posted with `resolves` and the reopen ran afterwards, so a failed reopen left a record that said `resolves`. That record also counted as a settling answer for the approval check and the round recap.

  When threads are resolved or reopened does not change. Only the record does, plus one rewrite of the answer after a clearing resolve went through.

  `resolveAddressedThreads` already reads who resolved each thread live, so a thread the PR author resolved a second time is reopened and then resolved by Manki. A new test covers that case.

  ## Why

  `npm run review-stats` reads these records, so wrong states skewed the reply statistics, and a `resolves` record on a thread that was never cleared read as a settled answer.

  ## How tested

  - `src/interaction.test.ts`: the reply fate table now expects `stays_resolved` for a thread that stays resolved, and checks that a clearing answer is rewritten to `resolves` only when the reopen succeeded.
  - `src/index.test.ts`: new test for an addressed thread the PR author resolved a second time.
  - `npx tsc --noEmit`, `npx tsc --noEmit -p tsconfig.test.json`, `npx eslint` on the touched files.

  Fixes #1534
