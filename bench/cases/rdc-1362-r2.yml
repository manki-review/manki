    severity: suggestion
    mechanism: "The comments and docs say `Vec<T>` decodes any length up to `MAX_COMPACT_SIZE`, but the stream stops after 32 MiB of bytes."
    locations: ["dash/src/consensus/encode.rs", "MAX_COMPACT_SIZE", "consensus_decode"]
    source: "Manki v7.3.2 round 2"
  - id: N2
    severity: warning
    mechanism: "Without the `MAX_VEC_SIZE` budget, the dash-spv storage migrator can read up to 32 MiB for one corrupt length in stored data."
    locations: ["dash-spv/src/storage/migrator"]
    source: "owner /check review"
