    - id: P3
      severity: blocker
      title: Streaming `consensus_decode` on `Vec<T>` no longer has any total input or memory bound
      file: dash/src/consensus/encode.rs
      line: 746
      posted: thread
      state: open
      description: Before this change, `Vec<T>::consensus_decode` on a caller's reader was capped at `MAX_VEC_SIZE` (4 MB) by the default `Take`. The override now calls the finite-reader path directly, so for element types that hold their own vectors (`Vec<Vec<u8>>`, `Vec<Transaction>`, `Vec<MnListDiff>`, `Vec<QuorumEntry>`) a stream can announce 32M elements, each with lengths up to 32 MiB, and the decoder keeps allocating for as long as the peer sends data.
      how_to_fix: Keep a total budget on the streaming entry point, as the trait's own rules require. For example, wrap the reader in `take(MAX_COMPACT_SIZE)` or another documented cap in the `Vec<T>` and `Vec<u8>` `consensus_decode` overrides. A budget of `MAX_COMPACT_SIZE` still lets every length up to Core's `MAX_...
      security: true
must_keep_open:
  - id: P3
    severity: blocker
    mechanism: "`take(MAX_COMPACT_SIZE)` bounds the bytes the streaming `Vec<T>` decode reads to 32 MiB, but not memory: `Vec<Vec<u8>>` pushes a 24-byte element for each 1-byte empty inner vector, so 32 MiB of input holds about 800 MB, and more while the `Vec` doubles. A caller of the public `consensus_decode` on a reader gets no other bound."
    locations: ["dash/src/consensus/encode.rs", "consensus_decode", "MAX_COMPACT_SIZE"]
must_not_repeat: [P1, P2]
must_catch:
  - id: K1
    severity: blocker
    mechanism: "The PR lowers `MAX_MSG_SIZE` to 3 MiB, but Dash Core applies that limit only to messages it receives and sends QRINFO with no size check. Core sends the legacy reply, with each list built from genesis, when the peers' common protocol version is below `EFFICIENT_QRINFO_VERSION` (70236), and dash-spv admits peers by their services only, never their version. The mainnet fixture `dash/tests/data/test_DML_diffs/QR_INFO_0_2224359.hex` holds 5 full lists in 2,631,577 bytes, so a 6-list reply (`extra_share`) from a pre-70236 peer is about 3.16 MB, over the new cap, and dash-spv refuses it."
    locations: ["dash/src/network/message.rs", "MAX_MSG_SIZE", "dash-spv/src/network/peer.rs", "QRInfo"]
    source: "owner /check review"
nice_to_have:
