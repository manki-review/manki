repo: manki-review/manki
source: manki PR 1321, round 2
base: 1b0857a367fa64b15799d99a353f2c7d1655837a
head: 78c9856302cee7466b6328241363f5fc952b3b84
title: "fix: compare protocol methods only across a base"
body: |
  ## Summary

  Sibling-implementation questions no longer group methods that every type has across unrelated classes. Python `__init__` and other dunder methods, TypeScript `constructor` and `toString`, Go `String` and `Error`, and a Rust `new` are compared only between classes that share a base class or interface. Implementations of standard Rust traits are not compared at all. This fixes the last warning on #1289.

  ## Changes

  - `siblingImplementations` groups a protocol method by each base its class names, so two subclasses of `Account` still compare their `__eq__`, while two unrelated classes in one directory do not compare their `__init__`.
  - Python classes read their bases from the superclass list, keyword arguments left out, and TypeScript classes from `extends` and `implements`, once per class. A base may be a dotted path such as `models.Model`. Standard bases unrelated classes name, such as `object`, `Generic`, `Protocol`, `ABC`, `Enum`, `Exception` or `Error`, are left out, and so is a base written as a long expression. Classes that share two bases are asked about a method once.
  - Methods of standard Rust traits, such as `Display`, `Debug`, `Clone`, `Default`, `From`, `PartialEq` or `Hash`, are not grouped, since unrelated types each implement them. Domain traits, such as a codec trait shared by message types, are grouped as before.
  - `docs/how-reviews-work.md` describes the rule.

  General defect class: a comparison question between types that have nothing in common but a method every type has, which costs a model call and invites speculative findings.

  Example outside rust-dashcore: a Python package with `User`, `Invoice` and `Settings` classes in one directory, where a PR edits `User.__init__`, used to ask why `Invoice.__init__` lacks the same checks.

  What it could make worse: two unrelated classes that do need the same constructor checks are no longer compared, unless they share a base. Go has no declared interfaces, so Go `String` and `Error` are never compared.

  ## Testing

  `npx jest src/symbol-uses.test.ts src/compare.test.ts src/review.test.ts` passes. The sibling-implementation test adds the following, on classes with and without a shared base: Python dunder methods, Go `String`, Rust `Display::fmt` and `new`, TypeScript `constructor` and `toString`, a dotted base, two shared bases, and classes sharing only `Generic` and `ABC`. Only the shared-base groups remain, each asked once. Each of these cases fails without its fix. The size test adds one Python class with 20,000 bases and 2,000 methods.

  Part of #1281
