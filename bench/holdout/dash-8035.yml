must_catch:
  - id: K1
    severity: warning
    mechanism: "After the coordinator clicks the new \"Release my coins\" button on the Approvals page, `m_coins_released` is set, but an imported final approval still makes `absorbSession` call `runCombineAndSign` with no user action. `signOwnFundingInputs` then signs the released coins into the registration, clears `m_coins_released` and locks the coins again through `refreshContributedCoinLocks`, so the release is silently undone."
    locations: ["src/qt/sharedmncreatedialog.cpp", "absorbSession", "runCombineAndSign", "signOwnFundingInputs", "m_coins_released"]
    fix: "97ac5d9eb289284002bafffa6672ee2f26c1bfcb"
  - id: K2
    severity: warning
    mechanism: "The contribution page's `releaseCoins` removes and unlocks this wallet's contribution but never sets `m_coins_released`. A participant reply made from the earlier invitation still carries that contribution, `MnShareSession::absorbDraftReply` adds it back, and `absorbSession` then calls `refreshContributedCoinLocks`, which locks the released coins again."
    locations: ["src/qt/sharedmncreatedialog.cpp", "releaseCoins", "absorbSession", "refreshContributedCoinLocks", "m_coins_released"]
    fix: "618fc3158b69827945807dd17032246081e0b409"
nice_to_have:
  - id: N1
    severity: suggestion
    mechanism: "`saveSession` now reports success to `reject`, but it returns true without checking that `file.write` wrote the whole session or that the file was flushed. On a write error, Save and Close closes the dialog with an incomplete session file while the coins stay reserved."
    locations: ["src/qt/sharedmncreatedialog.cpp", "saveSession", "reject"]
  - id: N2
    severity: warning
    mechanism: "`releaseReservedCoins` unlocks the coins and sets `m_coins_released`, but leaves the contribution in the session. `refreshContributionPage` decides what the coins card says from `myContribution() != nullptr` alone, so after \"Release my coins\" the card still says the coins are reserved and cannot be spent. `refreshContributedCoinLocks` returns early while `m_coins_released` is set and `unlockTerms` does not clear it, so after the new button on the Approvals page and Unlock Terms the coins stay unlocked while the page shows them as reserved."
    locations: ["src/qt/sharedmncreatedialog.cpp", "releaseReservedCoins", "refreshContributionPage", "m_coins_released", "unlockTerms", "myContribution"]
    source: "hold-out pass on the bench runs 42966217283, 43165981373 and 43170995642"
