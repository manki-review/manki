  findings:
    - id: P1
      severity: warning
      title: Pause state follows delivery order, so reordered or redelivered ticks leave the wrong value
      file: src/coordinator.ts
      line: 929
      posted: thread
      state: open
      description: Each settings delivery carries an absolute `ticked` value, and `applySettings` stores it as `settings.paused`. `GitHub` does not guarantee delivery order, and the reconciler redelivers failed deliveries up to 6 hours later. A tick followed quickly by an untick can therefore arrive as untick then tick, or a redelivered tick can land after a newer untick. Pause then stays set while the comment shows it cleared, and automatic reviews are silently skipped. Derive the value from the comment's current...
    - id: P2
      severity: warning
      title: A failed cancel is reported as requested and never retried as a user cancel
      file: src/coordinator.ts
      line: 972
      posted: thread
      state: open
      description: "`cancel` keeps the item running when the `GitHub` cancel call fails and does not throw. `cancelReview` still returns `cancel of work N requested`, and `applySettings` finishes the settings item as `done`. The writer's Cancel tick is consumed and the run goes on until the 40-minute poll timeout, where it ends as `timed_out` instead of `cancelled`. Have `cancel` return whether it succeeded, and let `cancelReview` throw or report the failure so the settings item is retried."
    - id: P3
      severity: warning
      title: Revert flips each box relative to the edit instead of restoring the coordinator's state
      file: src/coordinator.ts
      line: 987
      posted: thread
      state: open
      description: "`revertBoxes` sets each box to `!ticked` on the comment as it is now. Take an outsider who ticks Pause and then unticks it. Both edits queue. The first revert leaves Pause unticked. The second revert ticks it again. The comment now shows Pause ticked while `settings.paused` is `false`, and a writer who unticks it changes nothing. Set `pause` to `this.reported().settings.paused` and every one-shot box to unticked, so the comment always matches what applies."
      suggested_fix: "    const reverted = setBoxes(body ?? '', changes.map(({ box }) => ({ box, ticked: box === 'pause' ? this.reported().settings.paused : false })));"
must_resolve: [P1, P2, P3]
