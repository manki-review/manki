repo: manki-review/token-service
source: token-service PR 42, round 2
base: cf7437c087aa8063a8ed451a107eb506a3ae72a5
head: 790436d5716fe86e79ab94190c70799e14c7bd08
title: "feat: handle settings box edits in the Worker"
body: |
  ## Summary

  The Worker now applies the settings boxes on Manki's progress comment. A writer's tick acts at once without a runner: Pause stops automatic reviews until unticked, Full review, Deeper review, Review this draft and Force review each ask for one review with that mode, and Cancel cancels the running review. A tick by someone without write access is put back. `/state` returns the result for the Action (manki-review/manki#534).

  ## `/state` shape (manki-review/manki#534 builds on this)

  - Top level `settings: { paused: boolean }`. Its presence tells the Action that the Worker handles the boxes.
  - Every `active[]` and `queue[]` item carries `modes: ('full' | 'deeper' | 'draft' | 'force')[]`, empty for an item without modes. The run finds its own item by `run_id === github.context.runId` and reads its modes there, never from the dispatch inputs.

  ## Markup

  ```
  - [ ] Pause automatic reviews <!-- manki-box:pause -->
  - [ ] Full review <!-- manki-box:full -->
  - [ ] Deeper review <!-- manki-box:deeper -->
  - [ ] Cancel this review <!-- manki-box:cancel -->
  - [ ] Review this draft <!-- manki-box:draft -->
  - [ ] Force review <!-- manki-box:force -->
  <!-- manki-settings -->
  ```

  The Worker keys on the hidden `manki-box:<id>` only, so the Action may change labels and show only the boxes that apply.

  ## Changes

  - `src/manki.ts`: `SETTINGS_MARKER`, `changedBoxes` (the boxes whose tick differs between two bodies) and `setBoxes`.
  - `src/routing.ts`: an `issue_comment.edited` on a comment by one of Manki's logins holding the marker becomes a `settings` item in a new `settings` lane, with the changed boxes. An edit that changes no box, or has no earlier body, is ignored. Manki's own edits are already dropped as a bot's.
  - `src/coordinator.ts`:
    - The editor's write access is looked up as for any comment, now cached for 5 minutes per login. Without it, `revertBoxes` puts the changed boxes back on the comment and nothing else changes.
    - `applySettings`: Pause sets or clears `settings.paused`, which holds automatic reviews like the reported `pause`. A review box adds its mode to a review a writer already queued. A queued push review becomes the box's review, so a pause, a skip rule or a draft cannot drop it. Otherwise a review of the settings comment is queued. Cancel cancels the running review through the existing `cancel` with the coordinator's `actions: write` token, the item ends `skipped` with conclusion `cancelled`, and the cron leaves that head alone. Unticking any box but Pause changes nothing.
    - Settings edits of one comment are never collapsed in the queue, since each carries its own changes. An edit older than the last one applied (by the comment's `updated_at`) changes nothing, so a reordered or redelivered tick cannot undo a newer one.
    - A cancel GitHub fails throws, so the edit is tried again. Cancel is applied first within an edit. A revert sets Pause as it applies and every other box unticked.
    - New `modes` and `boxes` columns (one migration).
  - README documents the markup, the lane and the `/state` fields.

  ## What changes for users

  Once Manki v7 renders the boxes, ticking one acts within seconds and starts at most the one review it asks for. Nothing changes before that: today's Force review ticks work as before.

  ## Testing

  - `npx vitest run`: 482 passed. `npm run typecheck` clean.
  - Routing: a tick goes to the settings lane with the changed boxes (`[X]` counts), an edit that changes no box, one without the earlier body, and a copy of the boxes in someone else's comment are ignored.
  - Coordinator:
    - Pause holds a push review, a Force review tick on the paused PR still dispatches with `modes: ['force']`, and after the untick a push dispatches again.
    - Full, Deeper and Pause ticks on a queued push review turn it into one review of the settings comment with `modes: ['full', 'deeper']`, which dispatches although the PR is paused.
    - Cancel cancels the running run (`POST actions/runs/9000/cancel`), the item ends `skipped`/`cancelled` and the head counts as handled. With nothing running it does nothing.
    - A tick by someone without write access is put back on the comment as the state applies (also for a tick then an untick, and for an untick of a writer's Pause), changes nothing and dispatches nothing, and they are looked up once.
    - An edit older than the last applied one is ignored. A failed cancel is retried.
    - The empty and running `/state` replies include `settings` and `modes`.

  Closes #30
  Part of manki-review/manki#1036
