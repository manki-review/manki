id: manki-1262-r2
repo: manki-review/manki
source: manki PR 1262, round 2
base: 6fc83ec4be6ec846d68955b2d29198a24c5758cd
head: 3b06709765e759ddcf9e7355a1ab3c8387f82e51
title: "feat: report the second refuter's agreement in stats"
body: |
  ## Summary

  A follow-up to #1255 that does Manki's two suggestions on it. `review-stats` now reports what the second refuter (`models.refuter_pair`) costs and how often it changes anything, so the owner can judge whether the extra calls pay off, as #1164 asks. The round record also names the second refuter's model when it only reused earlier answers.

  ## Changes

  - `review-stats` gets a "Second refuter" section with the second refuter's cost and the findings it checked. It shows the share where it agreed with the first refuter, the share where the two split (one confirmed, one disproved), and the share where it changed the outcome the first refuter alone gave. It changes the outcome on a split, and when it settles a finding the first left unsettled or never answered. A table counts each pair of outcomes.
  - Refutation outcomes in `review-stats` now also count the findings a disproof dropped (listed with the judge's drops), unposted findings, and leads left unsettled, which each recorded lead now carries with its refutations. An answer a later round reused counts only once. The second refuter's cost names calls with no known price instead of counting them as free.
  - The round record names `models.refuterPair` when a finding carries a second answer reused from an earlier round, not only when a `refute_pair` call ran.
  - `docs/how-reviews-work.md` lists the new report lines.

  What changes for users: the weekly review statistics show the second refuter's numbers, and the refutation table includes dropped findings.

  ## Testing

  - `scripts/review-stats.test.ts`: a kept blocker with a split and a dropped finding the second refuter decided, plus a priced `refute_pair` call. It checks the counts, the cost and the rendered section, and that an empty report says there was no second refuter.
  - `src/index.test.ts`: a round that only reused a stored second answer still records `models.refuterPair`.

  Part of #1242
