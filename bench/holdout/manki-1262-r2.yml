prior_round:
  head: 4cd46a4f90dea7b5f55154e4e72d4bb4db6c70ad
  findings:
    - id: P1
      severity: warning
      title: Second refuter stats count answers reused from earlier rounds as new checks
      file: scripts/review-stats.ts
      line: 213
      posted: thread
      state: open
      description: A reused `pairRefutation` is copied into each later round's entries (`src/refute.ts:236-239`). `computeStats` counts it again in every round, but `pairRefutationCost` only counts `refute_pair` calls that ran. So "Findings checked" and the agree, split and changed shares are inflated, and the "for N USD" figure covers fewer findings than the count beside it.
    - id: P2
      severity: suggestion
      title: '"Changed the outcome" counts a split on a blocker, which never changes'
      file: scripts/review-stats.ts
      line: 343
      posted: thread
      state: open
      description: The `split` test counts every confirmed/disproved pair as a changed outcome. The docs say a disproved blocker keeps its grade whether or not the second refuter agrees. So for a blocker where the first refuter disproved and the second confirmed, the result is the same as without the second refuter, yet the report counts it.
    - id: P3
      severity: warning
      title: Refuted findings that are neither posted nor dropped by the judge are left out of the refuter counts
      file: scripts/review-stats.ts
      line: 213
      posted: thread
      state: open
      description: The loop reads only `findings.entries` and `judge.dropped`. Leads below blocker that the refuters left unsettled go to `openLeads`, and the record keeps their refutations in neither list. Unposted pre-existing findings sit in `findings.unposted`, which `tallyRound` reads but this loop does not.
    - id: P4
      severity: warning
      title: The second refuter's cost shows 0.00 USD when its calls are unpriced, such as on the Codex CLI
      file: scripts/review-stats.ts
      line: 217
      posted: thread
      state: open
      description: "`c.costUsd ?? 0` counts an unpriced call as free and says nothing about it. The docs recommend a second refuter from another provider, and it needs a CLI with repository tools."
    - id: P5
      severity: suggestion
      title: "`models.refuterPair` names the current model for an answer an earlier model gave"
      file: src/round-context.ts
      line: 303
      posted: thread
      state: open
      description: The new condition records the current `models.refuterPair` whenever a finding carries a `pairRefutation`. But `priorRefutation` reuses a stored answer without checking which model gave it, and `Refutation` has no model field. After someone changes `models.refuter_pair`, a round that only reused earlier answers says the new model checked findings it never saw.
must_resolve: [P1, P3, P4]
must_not_repeat: [P2, P5]
